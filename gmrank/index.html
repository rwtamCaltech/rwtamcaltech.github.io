  <div class="prose">
    <h2>How the scores work</h2>
    <p>Every move is valued in one currency: <b>surplus value in % of the salary cap × seasons</b>. A player who produced like a 20%-of-cap player while being paid 8% of the cap for two seasons is worth <b>+24</b>. Using % of each season's cap makes 2010 and 2026 moves comparable.</p>

    <h3>Production → fair salary</h3>
    <p>Each season, every player gets a production value that blends three all-in-one metrics, each divided by its league-wide spread that season:</p>
    <ul>
      <li><b>VORP</b> (Box Plus/Minus based) and <b>Win Shares</b>, from Basketball-Reference;</li>
      <li><b>EPM</b> (Estimated Plus-Minus) from DunksAndThrees, as (EPM + 2) × minutes ÷ 3936, the VORP formula on EPM. DunksAndThrees only publishes the latest completed season for free, so EPM is blended in for <span id="epm-seasons"></span> and more seasons are added as they are published.</li>
    </ul>
    <p>Production becomes a <b>fair salary</b> by quantile matching: the player with the k-th percentile production that season is "worth" the k-th percentile salary that season. <b>Production before a move</b> is the last three completed seasons' fair salary weighted 50/30/20 (recency bias). <b>Age matters</b>: every future contract season is projected with an aging curve fitted from the data (the average year-over-year change in fair salary by age: rising before ~24, falling about 2% of the cap per year by 30 and 3% by 37), so a long deal for a veteran or a 1-year deal for a 37-year-old is judged on his expected decline, and an extension for a 22-year-old on his expected growth. <b>Injury years count less</b>: each season's weight is scaled by the minutes played that season relative to the player's busiest of the three, so a 5-game season next to two full ones carries about a tenth of its usual weight, while a player with a steady role keeps the plain 50/30/20. Only seasons completed before the move are used, so initial scores never peek at the future.</p>

    <h3>Draft score</h3>
    <p>Every draft class is <b>re-ranked</b> by career value to date (the sum of each season's fair salary), including undrafted players whose first NBA season followed that draft (their draft position is class size + 1, i.e. 61). Score = 10 × (ln(pick) − ln(re-rank)): pick 30 who re-ranks 5th = +17.9, pick 3 who re-ranks 30th = −23.0. <b>Lottery picks (1–15) who became a top-10 player of their class get a bonus</b> (4 + 0.8 × (10 − re-rank)), so the #1 pick who became the best player of the class counts as a steal, not just "as expected". Classes with fewer than 3 seasons played are scaled down (one season = ⅓). Undrafted finds are credited to the team they first played for, and only when they turned out well. Draft-night trades credit the team that ended up with the player. Drafts belong to the executive in charge for the following season.</p>

    <h3>Signing score (free agents, re-signings, extensions, waiver claims)</h3>
    <p><b>Initial</b> = (fair salary before the signing − average annual salary as % of cap) × years. <b>Bad multi-year deals are compounded</b>: × (1 + 0.12 per extra year), so a 4-year overpay hurts more than four 1-year overpays. Contract length and AAV come from the player's salary seasons until his next contract. Two-way, Exhibit 10 and 10-day deals are left out.</p>
    <p><b>Resolved</b> = what the player actually produced for this team in each contract season, minus what he was paid, pro-rated by the share of his minutes played there. A season on the payroll without playing counts as zero production. Contract years not played yet are judged on <b>what we know now</b> (the player's production through the last completed season), so an extension signed after a breakout year is re-rated if he has slipped since, even before the new deal starts. <b>Homegrown extensions</b> (re-signing or extending a player the team drafted, including on draft night) are docked half as much when they go wrong, since keeping your own draftee is often forced by restricted free agency and the market, and they can't be a "worst 3" move. Positive results count fully. <b>Rookie contracts</b> (a drafted player's first deal with the team credited with his pick, signed within ~6 months of the draft) are not scored as signings either: that value belongs to the draft score. Later extensions are scored. <b>Sign-and-trades</b> (a player signed and traded within a week) are not scored as signings: the team that receives him carries the contract in its trade score, and the signing team gets no credit for passing it on.</p>

    <h3>Let-go score (waived, or lost in free agency)</h3>
    <p>When a player leaves (waived, or his contract ends and he signs elsewhere) and signs a new deal within a year, the team is charged with the bargain it let walk: <b>initial</b> = −(his fair salary before leaving − his new AAV) × years (up to 3, compounded). If the new team overpays him, the team gets half that overpay as a credit for letting him go. <b>Resolved</b> uses what he actually produced for the new team, relative to the new salary, over up to 3 seasons. (Example: a player waived and claimed by another team who plays well for that team on his small salary counts against the team that waived him.) Traded players are judged in the trade score, not here.</p>

    <h3>Trade score</h3>
    <p><b>Initial</b>, from each team's side: every incoming player is worth (fair salary before the trade − his salary) × years left on his contract (the current season pro-rated by how much is left). Outgoing players count the other way, so dumping a bad contract is a plus. <b>A bad contract that is expiring</b> (or has only a team option left) is halved, and one with a single year left is cut by a quarter. Draft picks are worth the average value of that draft slot, measured exactly the way a used pick is judged: the player's first-four-seasons production above a minimum-salary player if he became a role player or better, otherwise 0. That keeps a pick worth the same on average before and after it's used, so pick collections aren't inflated while they're still promises. The expected slot comes from the original owner's record (future picks drift toward the middle, uncertainty grows each year out), protections ("top-N protected") remove the protected slots, swaps count a quarter, and <b>far-future picks are discounted 10% per year</b> beyond the next draft (a pick 6 drafts away is worth about half), since they are years from helping and highly uncertain. As the draft gets closer, the discount shrinks.</p>
    <p>Once a pick is used, its value comes from the <b>actual slot</b> it became, then from the player's own production as his seasons come in.</p><p><b>Resolved</b>: incoming players count only for the time they actually played for the team (a player who leaves after half a season only earns half a season of credit, while the price paid counts in full). Outgoing players are followed for 3 seasons on the contract they were traded with; if they play well elsewhere, the team that traded them is docked. Picks are judged by the player they became, over his rookie contract, and count only if he became a <b>role player or better</b> (a fair salary at or above the league median for 1,000-minute players). Then the receiver gets the plus and the team that traded the pick takes the same minus. Picks not used yet keep their initial value, and contract years not played yet are judged on the player's latest production.</p>
    <p><b>Headline score:</b> every move's headline is its <b>resolved</b> score whenever it has one: what has happened plus the current-knowledge estimate of what hasn't. So rankings always use the best available information. The day-of initial score stays available with the "Show initial scores" toggle, and "played out" shows how much of the move is real rather than estimated.</p>

    <h3>Roster profile (value set)</h3>
    <p>On each GM page, every completed season the GM ran the team (in charge on Feb 1) gets ten team rates from Basketball-Reference team and opponent totals: points per possession (ORtg/100), true shooting %, rebound rate (TRB ÷ (TRB + opponent TRB)), assist rate (AST ÷ FG), steals per 100 opponent possessions, block rate (BLK ÷ opponent 2PA), turnover rate (TOV%), foul drawing (FTA ÷ FGA), three-point volume (3PA ÷ FGA) and points allowed per possession (DRtg/100). Each is compared with the 30 teams that season as a z-score and a league rank, so a 2010 team and a 2025 team are comparable. For turnovers and points allowed, lower counts as better. The GM's average z in each category is ranked against the other GMs. <b>Strengths</b> are the GM's best ranks that are in the top third of GMs (up to three); <b>weaknesses</b> are the worst ranks in the bottom third. <b>Overall level</b> ranks the average of all ten. <b>Roster balance</b> ranks how deep the holes are: the average shortfall below league average across the ten (0 = no category below average), so a team that is great at most things and slightly below average at one is well balanced. <b>Specialization</b> describes how uneven the profile is (the spread of the ten), from generalist to specialist; it isn't good or bad.</p>

    <h3>Championships</h3>
    <p>A title is what the moves are for, so production-per-dollar alone undersells the moves that won one. For every champion, each player who produced at least 8% of the team's Win Shares that season credits the move that <b>brought him to the team</b> (a trade, free-agent signing, waiver claim or draft pick; re-signing someone already there doesn't count) with <b>150 × his share of the team's Win Shares</b>. For example, Anthony Davis (23% of the 2019-20 Lakers' Win Shares) adds +34.9 to the trade for him. The credit is part of the resolved score, and a title counts as the move having played out, so it reaches the headline score.</p>

    <h3>Coach rating</h3>
    <p>The Coaches tab asks: <b>did the players play better or worse than expected under this coach?</b> Before each season, every player gets a <b>projected BPM</b> (Box Plus/Minus). It starts from his last three seasons, weighted 50/30/20 and by minutes so injury years count less. It's regressed toward replacement level (−2.0) by 1,000 minutes, so short histories count for less, and adjusted by an <b>aging curve</b> fitted from the data, since young players typically improve and veterans decline. Rookies start from the average rookie BPM of their draft range. His <b>actual BPM</b> is what he did with that team that season.</p>
    <p>The team's <b>overachievement</b> is the minutes-weighted average of actual − projected, × 5, i.e. points per 100 possessions the roster played above its projection. A 2,500-minute star missing his projection costs far more than a 50-minute reserve beating his. BPM is calibrated so that a team's minutes-weighted BPM × 5 tracks its net rating, so this is essentially "net rating vs. what this roster should have been". Each season is centered on the league average. A season shared by two coaches is split by games coached.</p>
    <p>A coach's <b>average</b> is the games-weighted average over his seasons with the team, and <b>cumulative</b> adds them up (in 82-game seasons). The <b>rank</b> uses the average shrunk toward 0 by two average seasons, so a single great year doesn't top the table. Former coaches (at least 20 games with a team since 2008-09) are ranked separately. Each coach page also shows his roster profile and, below his current team, his <b>other teams</b>: each run's overall rating, rank and roster profile, with a link to its season-by-season page. Caveats: player stats are season totals, so mid-season coaching changes are split by games, not by who actually played for whom. Tanking seasons count against the coach. And a long-tenured coach is partly measured against his own earlier work, because his players' previous seasons already include his coaching, which pulls long tenures toward 0.</p>

    <h3>This season's expectation score (Outlook)</h3>
    <p>The Outlook tab projects every team for the upcoming season from its current roster. Each player gets a <b>projected impact</b>, the same projected Box Plus/Minus as the coach rating (last three seasons weighted 50/30/20 and by minutes, regressed toward replacement level, plus the aging curve). Rookies get the average rookie BPM of their draft range. Each player also gets a <b>projected role</b>: minutes per game over his last three seasons × expected games, with recent games regressed halfway toward 65 so one injury year doesn't bury a starter. Drafted rookies get the average rookie-season minutes of their draft range, counting picks who didn't play as 0. College and international stats aren't in the data yet, so rookies are projected from draft position only.</p>
    <p><b>Projected minutes</b>: players are ordered by projected role and given the minutes a typical NBA rotation gives that slot (the average 1st, 2nd, 3rd… man across every team-season in the data), blended 70/30 with their own projected minutes. Every roster then sums to exactly 48 × 5 × 82 = 19,680 minutes, so each team plays the same 82-game season. The <b>expectation score</b> is the minutes-weighted projected BPM × 5: a projected net rating in points per 100 possessions vs an average team, centered so the league averages 0. Projected wins = 41 + 2.7 × that, and teams are ranked on it. A backtest on the last five seasons (rebuilt from each season's roster with projected minutes) tracks real net ratings with a correlation of about 0.6, typically within 3–4 points.</p>

    <h3>Labels</h3>
    <p>Each move: <span class="pill VERY_GOOD">VERY GOOD</span> ≥ +15 · <span class="pill GOOD">GOOD</span> ≥ +5 (a STEAL) · <span class="pill OK">OK</span> · <span class="pill BAD">BAD</span> ≤ −5 · <span class="pill VERY_BAD">VERY BAD</span> ≤ −15.<br>GM and team category ratings compare each score per season against the other 29 front offices: ≥ +1 SD very good, ≥ +0.35 SD good, within ±0.35 SD OK, and so on.</p>

    <h3>GMs, tenure and teams</h3>
    <p>The GM is the top basketball executive Basketball-Reference lists for the team, with exact start and end dates. A GM's moves are the ones their current team made from the day they took over (moves are credited to whoever was in charge on that date, so a draft right after a hiring belongs to the new GM). Data starts in <span id="first-season"></span>, so longer tenures are counted from then (marked †). <b>GMs are ranked by score per season</b>, so a 2-year GM and a 15-year GM are comparable Per-season scores are <b>shrunk toward the league average for short tenures</b>: (total + 3 × league rate per season) ÷ (seasons + 3). The per-season <b>ranking</b> then subtracts one standard error: the season-to-season spread of GM results ÷ √(seasons + 3). A GM with 1.5 seasons needs a clearly strong record to rank high, while a 19-year GM barely moves. Switch the table to totals to see accumulated value. <b>Former GMs</b> (every finished tenure since 2007-08, one row per team) are scored the same way, with the same short-tenure adjustment and league rates as the current GMs, and ranked in their own table. Team tables cover moves since <span id="team-start"></span>, and the last year and last 5 years.</p>

    <h3>Data and updates</h3>
    <p>Transactions, draft classes, advanced stats, team payrolls, contracts and the salary cap come from <a href="https://www.basketball-reference.com" rel="noopener">Basketball-Reference</a>; EPM comes from <a href="https://dunksandthrees.com/epm" rel="noopener">DunksAndThrees</a>. A cron job in the Docker container refreshes everything once a month. Finished seasons are cached, so monthly runs only download the current season. Spotrac, HoopsHype, RealGM, ESPN and stats.nba.com block automated requests, and LEBRON and Cleaning the Glass are behind paywalls or apps, so they aren't used.</p>
    <h3>Known limits</h3>
    <ul>
      <li>Contract length and AAV are inferred from salary seasons; options and incentives aren't modeled, except team options in current contracts.</li>
      <li>Stats inside a season aren't known month by month, so mid-season moves use only previously completed seasons.</li>
      <li>Trades are judged on players and picks; cash and trade exceptions aren't valued.</li>
      <li>Injured players count as zero production, so injuries count against the signing.</li>
    </ul>
